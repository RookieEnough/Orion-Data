name: Build Data Plane

# Replaces the old monolithic mirror generator.
#
# What changed and why:
#   * release history is fetched with conditional GETs, so a steady-state run
#     costs roughly what actually changed instead of ~4,000 API calls
#     (docs/SCALING.md 7.1)
#   * output is split into four tiers that each stay small as the catalogue
#     grows, instead of one 48 MB mirror.json (docs/SCALING.md 6)
#   * `mirrors/` and `updates.bin` are no longer produced: no client ever read
#     them, and together they doubled the data branch
#   * every artefact is written deterministically, so unchanged data produces
#     unchanged git blobs and costs nothing to commit
#
# The legacy mirror.json is still emitted for the shipped 2.x client, capped by
# --mirror-max; when the catalogue outgrows it the build trims history depth
# rather than crossing GitHub's 100 MiB blob limit.

on:
  workflow_dispatch:
  # Trigger immediately after an app is approved and added
  workflow_run:
    workflows: ["Process App Submissions (Batch)", "Process Bundle Submissions (Batch)"]
    types:
      - completed
  release:
    types: [published]
  schedule:
    - cron: '0 */6 * * *' # every 6 hours

permissions:
  contents: write

concurrency:
  group: data-plane
  cancel-in-progress: false

jobs:
  build:
    if: ${{ !github.event.workflow_run || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore the previous data plane
        # Unchanged releases then cost nothing: the builder reloads them from
        # the previous build and only refetches what moved.
        continue-on-error: true
        run: |
          mkdir -p .prev-restore dist
          if git fetch --depth=1 origin data:refs/remotes/origin/data 2>/dev/null; then
            echo "found the data branch"
            git archive refs/remotes/origin/data | tar -x -C .prev-restore
          else
            echo "no data branch yet - this run bootstraps from scratch"
            exit 0
          fi
          for d in catalog versions detail releases .state; do
            [ -e ".prev-restore/$d" ] && cp -r ".prev-restore/$d" dist/
          done
          [ -f .prev-restore/stars.json ] && cp .prev-restore/stars.json dist/
          [ -f .prev-restore/mirror.json ] && cp .prev-restore/mirror.json .prev-mirror.json
          [ -d .prev-restore/sentinel ] && cp -r .prev-restore/sentinel .keep-sentinel
          [ -f .prev-restore/leaderboard.json ] && cp .prev-restore/leaderboard.json .keep-leaderboard.json
          true

      - name: Build data plane
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          ARGS="--fetch --fetch-stars --check --mirror-max 44000000"
          if [ ! -d dist/releases ] && [ -f .prev-mirror.json ]; then
            echo "bootstrapping release history from the previous mirror.json"
            python scripts/build_data.py --from-mirror .prev-mirror.json $ARGS | tee build.log
          else
            python scripts/build_data.py $ARGS | tee build.log
          fi

      - name: Verify the published data resolves
        # Two invariants, both self-contained (no network, no previous build):
        #
        #  1. every app whose repository the build has release data for must be
        #     reachable in mirror.json under the key the 2.x client actually
        #     builds. Apps with no upstream releases are legitimately absent
        #     (81 of 1,734 today) and must not fail the build.
        #  2. tier 0 must describe exactly the apps index.json advertises.
        run: |
          python - <<'PY'
          import json, os, sys
          sys.path.insert(0, "scripts")
          import orion_data as od

          apps = od.load_apps("apps.json")
          mirror = od.load_json("dist/mirror.json")
          index = od.load_json("dist/index.json")

          repos_with_data = set()
          root = "dist/releases"
          for h1 in os.listdir(root):
              for name in os.listdir(os.path.join(root, h1)):
                  if name.endswith(".json"):
                      with open(os.path.join(root, h1, name), encoding="utf-8") as fh:
                          repos_with_data.update(json.load(fh).keys())

          resolvable = [a for a in apps if od.repo_key_of(a) in repos_with_data]
          missing = [a.get("id") for a in resolvable
                     if od.legacy_mirror_keys(a)
                     and od.legacy_mirror_keys(a)[0] not in mirror]

          print(f"apps                      : {len(apps):,}")
          print(f"repos with release data   : {len(repos_with_data):,}")
          print(f"apps resolvable from that : {len(resolvable):,}")
          print(f"unresolved (a real bug)   : {len(missing):,}")
          if missing:
              print("FAILED:", ", ".join(str(m) for m in missing[:20]))
              sys.exit(1)

          count = 0
          for part in range(256):
              path = f"dist/catalog/{part:02x}.bin"
              if os.path.exists(path):
                  with open(path, "rb") as fh:
                      count += len(od.decode_catalog(fh.read()))
          print(f"tier-0 rows decoded       : {count:,}  vs index.apps {index['apps']:,}")
          if count != index["apps"]:
              print("FAILED: tier 0 does not match index.json")
              sys.exit(1)

          print("OK: every app with release data resolves, and the tiers match the index")
          PY

      - name: Publish snapshot to the data branch
        run: |
          git config user.name "Orion Bot"
          git config user.email "bot@orion.store"

          # Everything the data branch should contain, staged outside the tree.
          rm -rf ../stage && mkdir -p ../stage
          cp -r dist/. ../stage/
          [ -d .keep-sentinel ] && cp -r .keep-sentinel ../stage/sentinel
          [ -f .keep-leaderboard.json ] && cp .keep-leaderboard.json ../stage/leaderboard.json

          # Ghost Protocol: one orphan commit, so the branch has no history to
          # grow. Unchanged shards keep their blob SHA, so the push carries only
          # the bytes that actually changed.
          git checkout --orphan data-plane-snapshot
          git rm -rf . >/dev/null 2>&1 || true
          git clean -fdx >/dev/null 2>&1 || true
          cp -r ../stage/. .
          rm -rf ../stage

          git add -A
          git commit -m "Data plane snapshot $(date -u +%FT%TZ)"
          git branch -M data
          git push --force origin data

      - name: Report
        if: always()
        run: |
          {
            echo "### Data plane"
            echo '```'
            tail -n 40 build.log 2>/dev/null || echo "build produced no log"
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
